<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Screen Recorder</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div class="container">
      <!-- Header -->
      <header class="header">
        <div class="logo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="12" r="10"></circle>
            <circle cx="12" cy="12" r="3"></circle>
          </svg>
        </div>
        <div>
          <h1>Screen Recorder</h1>
          <div class="subtitle">Professional Screen Capture Studio</div>
        </div>
        <span class="status" id="statusBadge">
          <span class="dot"></span>
          <span id="statusText">Ready</span>
        </span>
      </header>

      <!-- Video Area -->
      <main class="video-area" id="videoContainer">
        <video id="screenVideo" autoplay playsinline></video>
        
        <div class="placeholder" id="placeholder">
          <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round">
            <rect x="2" y="3" width="20" height="14" rx="2" ry="2"></rect>
            <line x1="8" y1="21" x2="16" y2="21"></line>
            <line x1="12" y1="17" x2="12" y2="21"></line>
          </svg>
          <p>Your screen preview will appear here</p>
        </div>

        <div class="timer" id="timer" style="display: none;">
          <span class="timer-dot"></span>
          <span id="recordingTime">00:00</span>
        </div>
      </main>

      <!-- Controls -->
      <footer class="controls">
        <button id="actionButton" class="btn primary">
          <span class="btn-icon">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
          </span>
          <span id="buttonText">Start Recording</span>
        </button>
      </footer>
    </div>
    <script src="script.js"></script>
  </body>
</html>
